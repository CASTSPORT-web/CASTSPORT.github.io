<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CASTSPORT - Pedidos de Uniformes</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
    padding: 14px;
}

.contenedor {
    max-width: 1000px;
    margin: auto;
}

.encabezado {
    background: #111;
    color: white;
    padding: 22px;
    border-radius: 12px;
    text-align: center;
    margin-bottom: 14px;
}

.encabezado h1 {
    font-size: 28px;
    margin-bottom: 5px;
}

.encabezado p {
    font-size: 13px;
}

.tarjeta {
    background: white;
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.titulo {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 14px;
}

.formulario {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.campo label {
    display: block;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 5px;
}

input,
select,
textarea {
    width: 100%;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
    background: white;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.lista {
    width: 100%;
}

.fila {
    display: grid;
    grid-template-columns: 70px 1fr 115px 100px 40px;
    gap: 7px;
    margin-bottom: 7px;
    align-items: center;
}

.fila input,
.fila select {
    height: 35px;
}

.genero {
    font-weight: bold;
    text-align: center;
    transition: background 0.2s;
}

.genero-f {
    background: #ffd9e6 !important;
}

.genero-m {
    background: #d8efff !important;
}

.boton-agregar {
    width: 100%;
    border: none;
    background: #111;
    color: white;
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 5px;
}

.boton-agregar:hover {
    background: #222;
}

.boton-eliminar {
    border: none;
    background: #dc3545;
    color: white;
    height: 35px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.boton-eliminar:hover {
    background: #bb2d3b;
}

.total {
    margin-top: 14px;
    background: #edf1f5;
    padding: 11px;
    border-radius: 7px;
    display: flex;
    justify-content: space-between;
    font-size: 13px;
}

.boton-generar,
.boton-descargar {
    width: 100%;
    border: none;
    color: white;
    padding: 11px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 10px;
}

.boton-generar {
    background: #198754;
}

.boton-generar:hover {
    background: #157347;
}

.boton-generar:disabled {
    background: #777;
    cursor: wait;
}

.boton-descargar {
    background: #2864e6;
}

.boton-descargar:hover {
    background: #1d4fc0;
}

.estado {
    display: none;
    margin-top: 10px;
    padding: 10px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
    text-align: center;
}

.estado.exito {
    display: block;
    background: #d1e7dd;
    color: #0f5132;
}

.estado.error {
    display: block;
    background: #f8d7da;
    color: #842029;
}


/* =========================================================
   PEDIDOS GUARDADOS
   ========================================================= */

.pedidos-guardados {
    margin-top: 18px;
}

.pedidos-cabecera {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.boton-actualizar {
    border: none;
    background: #111;
    color: white;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.boton-actualizar:hover {
    background: #333;
}

.pedido-card {
    border: 1px solid #ddd;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 12px;
    background: white;
}

.pedido-cabecera {
    background: #111;
    color: white;
    padding: 14px;
    cursor: pointer;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.pedido-cabecera:hover {
    background: #222;
}

.pedido-titulo {
    font-size: 16px;
    font-weight: bold;
}

.pedido-resumen {
    margin-top: 4px;
    font-size: 12px;
    color: #ddd;
}

.pedido-flecha {
    font-size: 18px;
    transition: transform 0.2s;
}

.pedido-card.abierto .pedido-flecha {
    transform: rotate(180deg);
}

.pedido-contenido {
    display: none;
    padding: 16px;
}

.pedido-card.abierto .pedido-contenido {
    display: block;
}

.pedido-seccion {
    margin-bottom: 18px;
}

.pedido-seccion h3 {
    font-size: 15px;
    margin-bottom: 9px;
}

.pedido-datos {
    background: #f4f6f8;
    border-radius: 8px;
    padding: 12px;
    line-height: 1.8;
    font-size: 13px;
}

.tabla-camisetas {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

.tabla-camisetas th {
    background: #111;
    color: white;
    padding: 9px;
    text-align: left;
}

.tabla-camisetas td {
    padding: 9px;
    border-bottom: 1px solid #ddd;
}

.tabla-camisetas tr:last-child td {
    border-bottom: none;
}

.pedido-observaciones {
    background: #fff8df;
    padding: 12px;
    border-radius: 8px;
    font-size: 13px;
    white-space: pre-wrap;
}

.pedido-acciones {
    display: flex;
    gap: 8px;
}

.boton-descargar-guardado {
    width: 100%;
    border: none;
    background: #2864e6;
    color: white;
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.boton-descargar-guardado:hover {
    background: #1d4fc0;
}

.sin-pedidos {
    text-align: center;
    padding: 25px;
    background: #f4f6f8;
    border-radius: 8px;
    color: #777;
    font-size: 13px;
}

.cargando {
    text-align: center;
    padding: 20px;
    color: #777;
}


/* PIE */

.pie {
    background: #111;
    color: white;
    padding: 16px;
    border-radius: 12px;
    text-align: center;
    margin-top: 10px;
}

.pie h2 {
    font-size: 21px;
    margin-bottom: 4px;
}

.pie p {
    font-size: 11px;
}


/* =========================================================
   MÓVIL
   ========================================================= */

@media (max-width: 700px) {

    .formulario {
        grid-template-columns: 1fr;
    }

    .fila {
        grid-template-columns: 55px 1fr 90px 75px 35px;
        gap: 5px;
    }

    .fila input,
    .fila select,
    .boton-eliminar {
        font-size: 11px;
    }

    .tabla-camisetas {
        font-size: 11px;
    }

    .tabla-camisetas th,
    .tabla-camisetas td {
        padding: 7px 5px;
    }

}

</style>

</head>


<body>

<div class="contenedor">


<!-- =========================================================
     ENCABEZADO
     ========================================================= -->

<div class="encabezado">

    <h1>CASTSPORT</h1>

    <p>
        Sistema de pedidos y personalización de uniformes
    </p>

</div>


<!-- =========================================================
     DATOS DEL EQUIPO
     ========================================================= -->

<div class="tarjeta">

    <div class="titulo">
        📋 Datos del equipo

    <div class="formulario">

        <div class="campo">

            <label>
                Nombre del equipo

            <input
                type="text"

        </div>


        <div class="campo">

            <label>

            </label>

            <input
                type="text"
                id="encargado"
                placeholder="Nombre del encargado">

        </div>


        <div class="campo">

            <label>
                Teléfono / WhatsApp
            </label>

            <input
                type="text"
                id="telefono"
                placeholder="Número de teléfono">

        </div>


        <div class="campo">

            <label>
                Tipo de uniforme
            </label>

            <select id="tipoUniforme">

</div>


<!-- =========================================================
     LISTA DE CAMISETAS
     ========================================================= -->

<div class="tarjeta">

    <div class="titulo">
        👕 Lista de camisetas
    </div>


    <div
        id="listaCamisetas"
        class="lista">
    </div>


    <button
        type="button"
        class="boton-agregar"
        onclick="agregarCamiseta()">

        + Agregar camiseta

    </button>


    <div class="total">

        <span>
            Total de camisetas
        </span>

        <strong id="total">
            0
        </strong>

    </div>

</div>


<!-- =========================================================
     OBSERVACIONES
     ========================================================= -->

<div class="tarjeta">

    <div class="titulo">
        📝 Observaciones
    </div>


    <textarea
        id="observaciones"
        placeholder="Escribe aquí alguna observación del pedido...">
    </textarea>


    <button
        type="button"
        id="botonGenerar"
        class="boton-generar"
        onclick="generarPedido()">

        ☑ Generar pedido

    </button>


    <button
        type="button"
        class="boton-descargar"
        onclick="descargarPedido()">

        📥 Descargar pedido

    </button>


    <div
        id="estado"

    </div>

</div>


<!-- =========================================================
     PEDIDOS GUARDADOS
     ========================================================= -->

<div class="tarjeta pedidos-guardados">

    <div class="pedidos-cabecera">

        <div class="titulo" style="margin-bottom:0;">
            📋 Pedidos guardados
        </div>

        <button
            type="button"
            class="boton-actualizar"
            onclick="cargarPedidosGuardados()">

            🔄 Actualizar

        </button>

    </div>


    <div id="listaPedidosGuardados">

        <div class="cargando">
            Cargando pedidos...
        </div>

    </div>

</div>


<!-- =========================================================
     PIE
     ========================================================= -->

<div class="pie">

    <h2>
        CASTSPORT
    </h2>

    <p>
        Sistema de pedidos y personalización de uniformes
    </p>

</div>


</div>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
    "https://gsacpnubhwpmlxtfcgtc.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_msIUw1EzeJGOIpUSV4EkOA_n2Aimnsw";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================================
   CONFIGURACIÓN
   ========================================================= */

const tallas = [
    "4",
    "6",
    "8",
    "10",
    "12",
    "14",
    "16",
    "XS",
    "S",
    "M",
    "L",
    "XL",
    "XXL"
];


let contador = 0;


/* =========================================================
   ESTADO
   ========================================================= */

function mostrarEstado(
    mensaje,
    tipo
) {

    const estado =
        document.getElementById("estado");

    estado.textContent =
        mensaje;

    estado.className =
        "estado " + tipo;

}


function limpiarEstado() {

    const estado =
        document.getElementById("estado");

    estado.textContent = "";

    estado.className =
        "estado";

}


/* =========================================================
   ESCAPAR TEXTO
   ========================================================= */

function escapeHTML(valor) {

    return String(valor ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   AGREGAR CAMISETA
   ========================================================= */

function agregarCamiseta(
    numero = "",
    nombre = "",
    talla = "",
    genero = ""
) {

    contador++;

    const lista =
        document.getElementById(
            "listaCamisetas"
        );


    const fila =
        document.createElement("div");


    fila.className =
        "fila";


    fila.innerHTML = `

        <input
            type="text"
            class="numero"
            placeholder="Nº"
            value="${escapeHTML(numero)}">


        <input
            type="text"
            class="nombre"
            placeholder="Nombre"
            value="${escapeHTML(nombre)}">


        <select class="talla">

            <option value="">
                Talla
            </option>

            ${tallas.map(t => `

                <option
                    value="${t}"
                    ${t === talla ? "selected" : ""}>

                    ${t}

                </option>

            `).join("")}

        </select>


        <select
            class="genero ${
                genero === "F"
                    ? "genero-f"
                    : genero === "M"
                        ? "genero-m"
                        : ""
            }"
            onchange="cambiarGenero(this)">

            <option value="">
                Género
            </option>

            <option
                value="F"
                ${genero === "F" ? "selected" : ""}>

                F

            </option>

            <option
                value="M"
                ${genero === "M" ? "selected" : ""}>

                M

            </option>

        </select>


        <button
            type="button"
            class="boton-eliminar"
            onclick="eliminarCamiseta(this)">

            ×

        </button>

    `;


    lista.appendChild(fila);

    actualizarTotal();

}


/* =========================================================
   CAMBIAR COLOR GÉNERO
   ========================================================= */

function cambiarGenero(select) {

    select.classList.remove(
        "genero-f"
    );

    select.classList.remove(
        "genero-m"
    );


    if (select.value === "F") {

        select.classList.add(
            "genero-f"
        );

    }


    if (select.value === "M") {

        select.classList.add(
            "genero-m"
        );

    }

}


/* =========================================================
   ELIMINAR CAMISETA
   ========================================================= */

function eliminarCamiseta(boton) {

    boton.parentElement.remove();

    actualizarTotal();

}


/* =========================================================
   TOTAL
   ========================================================= */

function actualizarTotal() {

    const filas =
        document.querySelectorAll(
            ".fila"
        );


    document.getElementById(
        "total"
    ).textContent =
        filas.length;

}


/* =========================================================
   OBTENER CAMISETAS
   ========================================================= */

function obtenerCamisetas() {

    const filas =
        document.querySelectorAll(
            ".fila"
        );


    return Array.from(filas).map(
        fila => {

            return {

                numero:
                    fila.querySelector(
                        ".numero"
                    ).value.trim(),

                nombre:
                    fila.querySelector(
                        ".nombre"
                    ).value.trim(),

                talla:
                    fila.querySelector(
                        ".talla"
                    ).value,

                genero:
                    fila.querySelector(
                        ".genero"
                    ).value

            };

        }
    );

}


/* =========================================================
   GENERAR PEDIDO
   ========================================================= */

async function generarPedido() {

    limpiarEstado();


    const boton =
        document.getElementById(
            "botonGenerar"
        );


    const equipo =
        document.getElementById(
            "equipo"
        ).value.trim();


    const encargado =
        document.getElementById(
            "encargado"
        ).value.trim();


    const telefono =
        document.getElementById(
            "telefono"
        ).value.trim();


    const tipo =
        document.getElementById(
            "tipoUniforme"
        ).value;


    const observaciones =
        document.getElementById(
            "observaciones"
        ).value.trim();


    const camisetas =
        obtenerCamisetas();


    /* VALIDACIONES */

    if (!equipo) {

        mostrarEstado(
            "Por favor, escribe el nombre del equipo.",
            "error"
        );

        return;

    }


    if (camisetas.length === 0) {

        mostrarEstado(
            "Agrega al menos una camiseta.",
            "error"
        );

        return;

    }


    for (
        let i = 0;
        i < camisetas.length;
        i++
    ) {

        if (!camisetas[i].nombre) {

            mostrarEstado(
                "La camiseta #" +
                (i + 1) +
                " necesita un nombre.",
                "error"
            );

            return;

        }


        if (!camisetas[i].talla) {

            mostrarEstado(
                "Selecciona la talla de " +
                camisetas[i].nombre,
                "error"
            );

            return;

        }


        if (!camisetas[i].genero) {

            mostrarEstado(
                "Selecciona el género de " +
                camisetas[i].nombre,
                "error"
            );

            return;

        }

    }


    boton.disabled = true;

    boton.textContent =
        "⏳ Guardando pedido...";


    try {

        /* =================================================
           GUARDAR PEDIDO
           ================================================= */

        const {
            data: pedido,
            error: errorPedido
        } = await supabaseClient
            .from("pedidos")
            .insert({

                /*
                 * Guardamos ambos porque tu tabla
                 * actualmente tiene ambos campos.
                 */

                equipo:
                    equipo,

                nombre_equipo:
                    equipo,

                encargado:
                    encargado,

                telefono:
                    telefono,

                tipo_uniforme:
                    tipo,

                observaciones:
                    observaciones || null

            })
            .select()
            .single();


        if (errorPedido) {

            throw errorPedido;

        }


        /* =================================================
           GUARDAR CAMISETAS
           ================================================= */

        const camisetasParaGuardar =
            camisetas.map(
                camiseta => {

                    return {

                        pedido_id:
                            pedido.id,

                        numero:
                            camiseta.numero || null,

                        nombre:
                            camiseta.nombre || null,

                        talla:
                            camiseta.talla || null,

                        genero:
                            camiseta.genero || null

                    };

                }
            );


        const {
            error: errorCamisetas
        } = await supabaseClient
            .from("camisetas")
            .insert(
                camisetasParaGuardar
            );


        if (errorCamisetas) {

            throw errorCamisetas;

        }


        /* =================================================
           CONFIRMACIÓN
           ================================================= */

        mostrarEstado(

            "✅ Pedido #" +
            pedido.id +
            " guardado correctamente.",

            "exito"

        );


        alert(

            "PEDIDO GUARDADO\n\n" +

            "Pedido #" +
            pedido.id +
            "\n" +

            "Equipo: " +
            equipo +
            "\n" +

            "Camisetas: " +
            camisetas.length

        );


        /*
         * Actualizamos inmediatamente
         * la lista de pedidos.
         */

        await cargarPedidosGuardados();


    } catch (error) {

        console.error(
            "Error guardando pedido:",
            error
        );


        mostrarEstado(

            "❌ No se pudo guardar el pedido: " +
            (
                error.message ||
                "Error desconocido"
            ),

            "error"

        );


        alert(

            "No se pudo guardar el pedido.\n\n" +

            (
                error.message ||
                "Error desconocido"
            )

        );


    } finally {

        boton.disabled = false;

        boton.textContent =
            "☑ Generar pedido";

    }

}


/* =========================================================
   CARGAR PEDIDOS GUARDADOS
   ========================================================= */

async function cargarPedidosGuardados() {

    const contenedor =
        document.getElementById(
            "listaPedidosGuardados"
        );


    if (!contenedor) {
        return;
    }


    contenedor.innerHTML = `

        <div class="cargando">
            ⏳ Cargando pedidos...
        </div>

    `;


    try {

        /*
         * Primero obtenemos los pedidos.
         */

        const {
            data: pedidos,
            error: errorPedidos
        } = await supabaseClient
            .from("pedidos")
            .select(
                "id, nombre_equipo, equipo, encargado, telefono, tipo_uniforme, observaciones, fecha_pedido"
            )
            .order(
                "id",
                {
                    ascending: false
                }
            );


        if (errorPedidos) {

            throw errorPedidos;

        }


        /*
         * Después obtenemos todas las camisetas.
         */

        const {
            data: camisetas,
            error: errorCamisetas
        } = await supabaseClient
            .from("camisetas")
            .select(
                "id, pedido_id, numero, nombre, talla, genero"
            )
            .order(
                "id",
                {
                    ascending: true
                }
            );


        if (errorCamisetas) {

            throw errorCamisetas;

        }


        if (
            !pedidos ||
            pedidos.length === 0
        ) {

            contenedor.innerHTML = `

                <div class="sin-pedidos">

                    📭 Todavía no hay pedidos guardados.

                </div>

            `;

            return;

        }


        /*
         * Agrupamos las camisetas por pedido_id.
         */

        const camisetasPorPedido = {};


        (camisetas || []).forEach(
            camiseta => {

                if (
                    !camisetasPorPedido[
                        camiseta.pedido_id
                    ]
                ) {

                    camisetasPorPedido[
                        camiseta.pedido_id
                    ] = [];

                }


                camisetasPorPedido[
                    camiseta.pedido_id
                ].push(
                    camiseta
                );

            }
        );


        contenedor.innerHTML = "";


        /*
         * Crear cada pedido.
         */

        pedidos.forEach(
            pedido => {

                const listaCamisetas =
                    camisetasPorPedido[
                        pedido.id
                    ] || [];


                const nombreEquipo =
                    pedido.nombre_equipo ||
                    pedido.equipo ||
                    "Sin nombre";


                const tarjeta =
                    document.createElement(
                        "div"
                    );


                tarjeta.className =
                    "pedido-card";


                tarjeta.innerHTML = `

                    <!-- CABECERA -->

                    <div
                        class="pedido-cabecera"
                        onclick="abrirPedido(this)"
                    >

                        <div>

                            <div class="pedido-titulo">

                                🧾 PEDIDO #${pedido.id}

                            </div>

/* =========================================================
   ABRIR / CERRAR PEDIDO
   ========================================================= */

function abrirPedido(cabecera) {

    const tarjeta =
        cabecera.parentElement;


    tarjeta.classList.toggle(
        "abierto"
    );

}


/* =========================================================
   FORMATEAR FECHA
   ========================================================= */

function formatearFecha(fecha) {

    if (!fecha) {
        return "—";
    }


    try {

        return new Date(
            fecha
        ).toLocaleString(
            "es-ES",
            {
                dateStyle: "short",
                timeStyle: "short"
            }
        );

    } catch {

        return fecha;

    }

}


/* =========================================================
   DESCARGAR PEDIDO ACTUAL
   ========================================================= */

function descargarPedido() {

    const equipo =
        document.getElementById(
            "equipo"
        ).value.trim()
        || "Sin nombre";


    const encargado =
        document.getElementById(
            "encargado"
        ).value.trim()
        || "";


    const telefono =
        document.getElementById(
            "telefono"
        ).value.trim()
        || "";


    const tipo =
        document.getElementById(
            "tipoUniforme"
        ).value;


    const observaciones =
        document.getElementById(
            "observaciones"
        ).value.trim()
        || "Sin observaciones";


    const camisetas =
        obtenerCamisetas();


    if (
        camisetas.length === 0
    ) {

        alert(
            "Agrega al menos una camiseta antes de descargar."
        );

        return;

    }


    let contenido = "";


    contenido +=
        "CASTSPORT\n";

    contenido +=
        "SISTEMA DE PEDIDOS Y PERSONALIZACIÓN DE UNIFORMES\n";

    contenido +=
        "===============================================\n\n";


    contenido +=
        "DATOS DEL EQUIPO\n";

    contenido +=
        "-----------------------------------------------\n";


    contenido +=
        "Nombre del equipo: " +
        equipo +
        "\n";


    contenido +=
        "Nombre del encargado: " +
        encargado +
        "\n";


    contenido +=
        "Teléfono / WhatsApp: " +
        telefono +
        "\n";


    contenido +=
        "Tipo de uniforme: " +
        tipo +
        "\n\n";


    contenido +=
        "LISTA DE CAMISETAS\n";

    contenido +=
        "-----------------------------------------------\n";


    camisetas.forEach(
        (camiseta, index) => {

            contenido +=

                (index + 1) +
                ". Nº: " +
                camiseta.numero +
                " | Nombre: " +
                camiseta.nombre +
                " | Talla: " +
                camiseta.talla +
                " | Género: " +
                camiseta.genero +
                "\n";

        }
    );


    contenido += "\n";


    contenido +=
        "Total de camisetas: " +
        camisetas.length +
        "\n\n";


    contenido +=
        "OBSERVACIONES\n";

    contenido +=
        "-----------------------------------------------\n";

    contenido +=
        observaciones +
        "\n\n";


    contenido +=
        "===============================================\n";

    contenido +=
        "CASTSPORT\n";


    const archivo =
        new Blob(
            [contenido],
            {
                type:
                    "text/plain;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            archivo
        );


    const enlace =
        document.createElement(
            "a"
        );


    enlace.href =
        url;


    enlace.download =
        "pedido-" +
        equipo.replace(
            /[^a-z0-9]/gi,
            "-"
        ) +
        ".txt";


    document.body.appendChild(
        enlace
    );


    enlace.click();


    document.body.removeChild(
        enlace
    );


    URL.revokeObjectURL(
        url
    );

}


/* =========================================================
   DESCARGAR PEDIDO GUARDADO
   ========================================================= */

async function descargarPedidoGuardado(
    id
) {

    try {

        /*
         * Obtener pedido.
         */

        const {
            data: pedido,
            error: errorPedido
        } = await supabaseClient
            .from("pedidos")
            .select(
                "id, nombre_equipo, equipo, encargado, telefono, tipo_uniforme, observaciones, fecha_pedido"
            )
            .eq(
                "id",
                id
            )
            .single();


        if (errorPedido) {

            throw errorPedido;

        }


        /*
         * Obtener camisetas.
         */

        const {
            data: camisetas,
            error: errorCamisetas
        } = await supabaseClient
            .from("camisetas")
            .select(
                "numero, nombre, talla, genero"
            )
            .eq(
                "pedido_id",
                id
            )
            .order(
                "id",
                {
                    ascending: true
                }
            );


        if (errorCamisetas) {

            throw errorCamisetas;

        }


        const nombreEquipo =
            pedido.nombre_equipo ||
            pedido.equipo ||
            "Sin nombre";


        let contenido = "";


        contenido +=
            "CASTSPORT\n";

        contenido +=
            "SISTEMA DE PEDIDOS Y PERSONALIZACIÓN DE UNIFORMES\n";

        contenido +=
            "===============================================\n\n";


        contenido +=
            "PEDIDO #" +
            pedido.id +
            "\n\n";


        contenido +=
            "DATOS DEL EQUIPO\n";

        contenido +=
            "-----------------------------------------------\n";


        contenido +=
            "Nombre del equipo: " +
            nombreEquipo +
            "\n";


        contenido +=
            "Nombre del encargado: " +
            (
                pedido.encargado ||
                ""
            ) +
            "\n";


        contenido +=
            "Teléfono / WhatsApp: " +
            (
                pedido.telefono ||
                ""
            ) +
            "\n";


        contenido +=
            "Tipo de uniforme: " +
            (
                pedido.tipo_uniforme ||
                ""
            ) +
            "\n";


        if (pedido.fecha_pedido) {

            contenido +=
                "Fecha: " +
                formatearFecha(
                    pedido.fecha_pedido
                ) +
                "\n";

        }


        contenido += "\n";


        contenido +=
            "LISTA DE CAMISETAS\n";

        contenido +=
            "-----------------------------------------------\n";


        (
            camisetas ||
            []
        ).forEach(
            (camiseta, index) => {

                contenido +=

                    (index + 1) +
                    ". Nº: " +
                    (
                        camiseta.numero ||
                        "—"
                    ) +
                    " | Nombre: " +
                    (
                        camiseta.nombre ||
                        "—"
                    ) +
                    " | Talla: " +
                    (
                        camiseta.talla ||
                        "—"
                    ) +
                    " | Género: " +
                    (
                        camiseta.genero ||
                        "—"
                    ) +
                    "\n";

            }
        );


        contenido += "\n";


        contenido +=
            "Total de camisetas: " +
            (
                camisetas ||
                []
            ).length +
            "\n\n";


        contenido +=
            "OBSERVACIONES\n";

        contenido +=
            "-----------------------------------------------\n";


        contenido +=
            pedido.observaciones ||
            "Sin observaciones";


        contenido += "\n\n";


        contenido +=
            "===============================================\n";

        contenido +=
            "CASTSPORT\n";


        const archivo =
            new Blob(
                [contenido],
                {
                    type:
                        "text/plain;charset=utf-8"
                }
            );


        const url =
            URL.createObjectURL(
                archivo
            );


        const enlace =
            document.createElement(
                "a"
            );


        enlace.href =
            url;


        enlace.download =
            "pedido-" +
            pedido.id +
            "-" +
            nombreEquipo.replace(
                /[^a-z0-9]/gi,
                "-"
            ) +
            ".txt";


        document.body.appendChild(
            enlace
        );


        enlace.click();


        document.body.removeChild(
            enlace
        );


        URL.revokeObjectURL(
            url
        );


    } catch (error) {

        console.error(
            "Error descargando pedido:",
            error
        );


        alert(

            "No se pudo descargar el pedido.\n\n" +

            (
                error.message ||
                "Error desconocido"
            )

        );

    }

}
