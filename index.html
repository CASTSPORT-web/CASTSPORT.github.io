<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CASTSPORT - Pedidos de Uniformes</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
    padding: 14px;
}

.contenedor {
    max-width: 1000px;
    margin: auto;
}

.encabezado {
    background: #111;
    color: white;
    padding: 22px;
    border-radius: 12px;
    text-align: center;
    margin-bottom: 14px;
}

.encabezado h1 {
    font-size: 28px;
    margin-bottom: 5px;
}

.encabezado p {
    font-size: 13px;
}

.tarjeta {
    background: white;
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.titulo {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 14px;
}

.formulario {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.campo label {
    display: block;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 5px;
}

input,
select,
textarea {
    width: 100%;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
    background: white;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.lista {
    width: 100%;
}

.fila {
    display: grid;
    grid-template-columns: 70px 1fr 115px 100px 40px;
    gap: 7px;
    margin-bottom: 7px;
    align-items: center;
}

.fila input,
.fila select {
    height: 35px;
}

.genero {
    font-weight: bold;
    text-align: center;
    transition: background 0.2s;
}

.genero-f {
    background: #ffd9e6 !important;
}

.genero-m {
    background: #d8efff !important;
}

.boton-agregar {
    width: 100%;
    border: none;
    background: #111;
    color: white;
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 5px;
}

.boton-agregar:hover {
    background: #222;
}

.boton-eliminar {
    border: none;
    background: #dc3545;
    color: white;
    height: 35px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.total {
    margin-top: 14px;
    background: #edf1f5;
    padding: 11px;
    border-radius: 7px;
    display: flex;
    justify-content: space-between;
    font-size: 13px;
}

.boton-generar,
.boton-descargar {
    width: 100%;
    border: none;
    color: white;
    padding: 11px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 10px;
}

.boton-generar {
    background: #198754;
}

.boton-generar:hover {
    background: #157347;
}

.boton-descargar {
    background: #2864e6;
}

.boton-descargar:hover {
    background: #1d4fc0;
}

.pie {
    background: #111;
    color: white;
    padding: 16px;
    border-radius: 12px;
    text-align: center;
    margin-top: 10px;
}

.pie h2 {
    font-size: 21px;
    margin-bottom: 4px;
}

.pie p {
    font-size: 11px;
}

/* En pantallas pequeñas */
@media (max-width: 700px) {

    .formulario {
        grid-template-columns: 1fr;
    }

    .fila {
        grid-template-columns: 55px 1fr 90px 75px 35px;
        gap: 5px;
    }

    .fila input,
    .fila select,
    .boton-eliminar {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<div class="contenedor">

    <!-- ENCABEZADO -->
    <div class="encabezado">
        <h1>CASTSPORT</h1>
        <p>Sistema de pedidos y personalización de uniformes</p>
    </div>

    <!-- DATOS DEL EQUIPO -->
    <div class="tarjeta">

        <div class="titulo">
            📋 Datos del equipo
        </div>

        <div class="formulario">

            <div class="campo">
                <label>Nombre del equipo</label>
                <input
                    type="text"
                    id="equipo"
                    placeholder="Nombre del equipo">
            </div>

            <div class="campo">
                <label>Nombre del encargado</label>
                <input
                    type="text"
                    id="encargado"
                    placeholder="Nombre del encargado">
            </div>

            <div class="campo">
                <label>Teléfono / WhatsApp</label>
                <input
                    type="text"
                    id="telefono"
                    placeholder="Número de teléfono">
            </div>

            <div class="campo">
                <label>Tipo de uniforme</label>
                <select id="tipoUniforme">
                    <option>Camiseta</option>
                    <option>Conjunto</option>
                    <option>Uniforme completo</option>
                </select>
            </div>

        </div>
    </div>


    <!-- LISTA DE CAMISETAS -->
    <div class="tarjeta">

        <div class="titulo">
            👕 Lista de camisetas
        </div>

        <div id="listaCamisetas" class="lista"></div>

        <button
            type="button"
            class="boton-agregar"
            onclick="agregarCamiseta()">
            + Agregar camiseta
        </button>

        <div class="total">
            <span>Total de camisetas</span>
            <strong id="total">0</strong>
        </div>

    </div>


    <!-- OBSERVACIONES -->
    <div class="tarjeta">

        <div class="titulo">
            📝 Observaciones
        </div>

        <textarea
            id="observaciones"
            placeholder="Escribe aquí alguna observación del pedido..."></textarea>

        <button
            type="button"
            class="boton-generar"
            onclick="generarPedido()">
            ☑ Generar pedido
        </button>

        <button
            type="button"
            class="boton-descargar"
            onclick="descargarPedido()">
            📥 Descargar pedido
        </button>

    </div>


    <!-- PIE -->
    <div class="pie">
        <h2>CASTSPORT</h2>
        <p>Sistema de pedidos y personalización de uniformes</p>
    </div>

</div>


<script>

const tallas = [
    "4",
    "6",
    "8",
    "10",
    "12",
    "14",
    "16",
    "XS",
    "S",
    "M",
    "L",
    "XL",
    "XXL"
];

let contador = 0;


/* AGREGAR CAMISETA */
function agregarCamiseta(
    numero = "",
    nombre = "",
    talla = "",
    genero = ""
) {

    contador++;

    const lista = document.getElementById("listaCamisetas");

    const fila = document.createElement("div");

    fila.className = "fila";

    fila.innerHTML = `

        <input
            type="text"
            class="numero"
            placeholder="Nº"
            value="${numero}">

        <input
            type="text"
            class="nombre"
            placeholder="Nombre"
            value="${nombre}">

        <select class="talla">

            <option value="">Talla</option>

            ${tallas.map(t =>
                `<option value="${t}" ${t === talla ? "selected" : ""}>
                    ${t}
                </option>`
            ).join("")}

        </select>

        <select
            class="genero ${genero === "F" ? "genero-f" : genero === "M" ? "genero-m" : ""}"
            onchange="cambiarGenero(this)">

            <option value="">Género</option>
            <option value="F" ${genero === "F" ? "selected" : ""}>F</option>
            <option value="M" ${genero === "M" ? "selected" : ""}>M</option>

        </select>

        <button
            type="button"
            class="boton-eliminar"
            onclick="eliminarCamiseta(this)">
            ×
        </button>
    `;

    lista.appendChild(fila);

    actualizarTotal();
}


/* CAMBIAR COLOR SEGÚN GÉNERO */
function cambiarGenero(select) {

    select.classList.remove("genero-f");
    select.classList.remove("genero-m");

    if (select.value === "F") {
        select.classList.add("genero-f");
    }

    if (select.value === "M") {
        select.classList.add("genero-m");
    }
}


/* ELIMINAR */
function eliminarCamiseta(boton) {

    boton.parentElement.remove();

    actualizarTotal();
}


/* ACTUALIZAR TOTAL */
function actualizarTotal() {

    const filas = document.querySelectorAll(".fila");

    document.getElementById("total").textContent = filas.length;
}


/* GENERAR PEDIDO */
function generarPedido() {

    const equipo =
        document.getElementById("equipo").value;

    const encargado =
        document.getElementById("encargado").value;

    const telefono =
        document.getElementById("telefono").value;

    const tipo =
        document.getElementById("tipoUniforme").value;

    const observaciones =
        document.getElementById("observaciones").value;

    const filas =
        document.querySelectorAll(".fila");

    if (!equipo.trim()) {
        alert("Por favor, escribe el nombre del equipo.");
        return;
    }

    if (filas.length === 0) {
        alert("Agrega al menos una camiseta.");
        return;
    }

    let pedido = "";

    pedido += "CASTSPORT\n";
    pedido += "==============================\n\n";

    pedido += "DATOS DEL EQUIPO\n";
    pedido += "Equipo: " + equipo + "\n";
    pedido += "Encargado: " + encargado + "\n";
    pedido += "Teléfono: " + telefono + "\n";
    pedido += "Tipo de uniforme: " + tipo + "\n\n";

    pedido += "LISTA DE CAMISETAS\n";
    pedido += "==============================\n";

    filas.forEach((fila, index) => {

        const numero =
            fila.querySelector(".numero").value;

        const nombre =
            fila.querySelector(".nombre").value;

        const talla =
            fila.querySelector(".talla").value;

        const genero =
            fila.querySelector(".genero").value;

        pedido +=
            (index + 1) +
            ". Nº: " + numero +
            " | Nombre: " + nombre +
            " | Talla: " + talla +
            " | Género: " + genero +
            "\n";
    });

    pedido += "\n";
    pedido += "Total de camisetas: " + filas.length + "\n\n";

    pedido += "OBSERVACIONES\n";
    pedido += observaciones || "Sin observaciones";
    pedido += "\n";

    alert(pedido);
}


/* DESCARGAR PEDIDO */
function descargarPedido() {

    const equipo =
        document.getElementById("equipo").value || "Sin nombre";

    const encargado =
        document.getElementById("encargado").value || "";

    const telefono =
        document.getElementById("telefono").value || "";

    const tipo =
        document.getElementById("tipoUniforme").value;

    const observaciones =
        document.getElementById("observaciones").value || "Sin observaciones";

    const filas =
        document.querySelectorAll(".fila");

    if (filas.length === 0) {
        alert("Agrega al menos una camiseta antes de descargar.");
        return;
    }

    let contenido = "";

    contenido += "CASTSPORT\n";
    contenido += "SISTEMA DE PEDIDOS Y PERSONALIZACIÓN DE UNIFORMES\n";
    contenido += "===============================================\n\n";

    contenido += "DATOS DEL EQUIPO\n";
    contenido += "-----------------------------------------------\n";
    contenido += "Nombre del equipo: " + equipo + "\n";
    contenido += "Nombre del encargado: " + encargado + "\n";
    contenido += "Teléfono / WhatsApp: " + telefono + "\n";
    contenido += "Tipo de uniforme: " + tipo + "\n\n";

    contenido += "LISTA DE CAMISETAS\n";
    contenido += "-----------------------------------------------\n";

    filas.forEach((fila, index) => {

        const numero =
            fila.querySelector(".numero").value;

        const nombre =
            fila.querySelector(".nombre").value;

        const talla =
            fila.querySelector(".talla").value;

        const genero =
            fila.querySelector(".genero").value;

        contenido +=
            (index + 1) +
            ". Nº: " + numero +
            " | Nombre: " + nombre +
            " | Talla: " + talla +
            " | Género: " + genero +
            "\n";
    });

    contenido += "\n";
    contenido += "Total de camisetas: " + filas.length + "\n\n";

    contenido += "OBSERVACIONES\n";
    contenido += "-----------------------------------------------\n";
    contenido += observaciones + "\n\n";

    contenido += "===============================================\n";
    contenido += "CASTSPORT\n";


    const archivo = new Blob(
        [contenido],
        { type: "text/plain;charset=utf-8" }
    );

    const url =
        URL.createObjectURL(archivo);

    const enlace =
        document.createElement("a");

    enlace.href = url;

    enlace.download =
        "pedido-" +
        equipo.replace(/[^a-z0-9]/gi, "-") +
        ".txt";

    document.body.appendChild(enlace);

    enlace.click();

    document.body.removeChild(enlace);

    URL.revokeObjectURL(url);
}


/* CREAR 3 FILAS AL ABRIR */
agregarCamiseta();
agregarCamiseta();
agregarCamiseta();

</script>

</body>
</html>
