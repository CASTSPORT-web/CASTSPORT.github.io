<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CASTSPORT - Pedido de Uniformes</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
            padding: 20px;
        }

        .contenedor {
            max-width: 1000px;
            margin: auto;
        }

        .encabezado {
            background: #111;
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .encabezado h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .encabezado p {
            color: #ccc;
        }

        .tarjeta {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .tarjeta h2 {
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .campo label {
            font-weight: bold;
            font-size: 14px;
        }

        .campo input,
        .campo select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .jugador {
            display: grid;
            grid-template-columns: 70px 1fr 120px 50px;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
        }

        .jugador input,
        .jugador select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .btn-eliminar {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            height: 42px;
            cursor: pointer;
            font-size: 18px;
        }

        .btn-agregar {
            width: 100%;
            padding: 13px;
            background: #111;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-agregar:hover {
            background: #333;
        }

        .resumen {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f0f2f4;
            padding: 18px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
        }

        .btn-enviar {
            width: 100%;
            padding: 16px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .btn-enviar:hover {
            background: #146c43;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            resize: vertical;
        }

        @media (max-width: 700px) {

            body {
                padding: 10px;
            }

            .encabezado h1 {
                font-size: 28px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .jugador {
                grid-template-columns: 1fr;
            }

            .btn-eliminar {
                width: 100%;
            }

            .resumen {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <div class="encabezado">
        <h1>CASTSPORT</h1>
        <p>Sistema de pedidos y personalización de uniformes</p>
    </div>

    <div class="tarjeta">

        <h2>📋 Datos del equipo</h2>

        <div class="grid">

            <div class="campo">
                <label>Nombre del equipo</label>
                <input type="text" id="equipo" placeholder="Ejemplo: Fénix FC">
            </div>

            <div class="campo">
                <label>Nombre del encargado</label>
                <input type="text" id="encargado" placeholder="Nombre completo">
            </div>

            <div class="campo">
                <label>Teléfono / WhatsApp</label>
                <input type="tel" id="telefono" placeholder="999 999 999">
            </div>

            <div class="campo">
                <label>Tipo de uniforme</label>
                <select id="uniforme">
                    <option value="Camiseta">Camiseta</option>
                    <option value="Camiseta + Short">Camiseta + Short</option>
                    <option value="Conjunto completo">Conjunto completo</option>
                </select>
            </div>

        </div>

    </div>


    <div class="tarjeta">

        <h2>👕 Lista de camisetas</h2>

        <div id="listaJugadores">

        </div>

        <button class="btn-agregar" onclick="agregarJugador()">
            + Agregar camiseta
        </button>

        <div class="resumen">

            <div>
                Total de camisetas
            </div>

            <div class="total" id="total">
                0
            </div>

        </div>

    </div>


    <div class="tarjeta">

        <h2>📝 Observaciones</h2>

        <textarea id="observaciones"
            placeholder="Escribe aquí cualquier detalle especial del pedido..."></textarea>

        <button class="btn-enviar" onclick="generarPedido()">
            ✅ Generar pedido
        </button>

    </div>

</div>


<script>

    let contador = 0;


    function agregarJugador() {

        contador++;

        const lista = document.getElementById("listaJugadores");

        const jugador = document.createElement("div");

        jugador.className = "jugador";

        jugador.innerHTML = `

            <input
                type="number"
                placeholder="Nº"
                class="numero"
                min="0"
                max="99"
            >

            <input
                type="text"
                placeholder="Nombre"
                class="nombre"
            >

            <select class="talla">

                <option value="">Talla</option>
                <option value="2">2</option>
                <option value="4">4</option>
                <option value="6">6</option>
                <option value="8">8</option>
                <option value="10">10</option>
                <option value="12">12</option>
                <option value="14">14</option>
                <option value="16">16</option>
                <option value="S">S</option>
                <option value="M">M</option>
                <option value="L">L</option>
                <option value="XL">XL</option>
                <option value="XXL">XXL</option>

            </select>

            <button
                class="btn-eliminar"
                onclick="eliminarJugador(this)">
                ×
            </button>

        `;

        lista.appendChild(jugador);

        actualizarTotal();
    }


    function eliminarJugador(boton) {

        boton.parentElement.remove();

        actualizarTotal();
    }


    function actualizarTotal() {

        const jugadores =
            document.querySelectorAll(".jugador").length;

        document.getElementById("total").textContent = jugadores;
    }


    function generarPedido() {

        const equipo =
            document.getElementById("equipo").value;

        const encargado =
            document.getElementById("encargado").value;

        const telefono =
            document.getElementById("telefono").value;

        const jugadores =
            document.querySelectorAll(".jugador");

        if (!equipo || !encargado || !telefono) {

            alert("Por favor completa los datos del equipo.");

            return;
        }

        if (jugadores.length === 0) {

            alert("Agrega por lo menos una camiseta.");

            return;
        }

        alert(
            "¡Pedido generado correctamente!\\n\\n" +
            "Equipo: " + equipo + "\\n" +
            "Encargado: " + encargado + "\\n" +
            "Camisetas: " + jugadores.length
        );

    }


    // Agregamos una camiseta automáticamente
    agregarJugador();

</script>

</body>
</html>
