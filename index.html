<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CASTSPORT - Pedidos de Uniformes</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- AutoTable para jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
    padding: 14px;
}

.contenedor {
    max-width: 1000px;
    margin: auto;
}

.encabezado {
    background: #111;
    color: white;
    padding: 22px;
    border-radius: 12px;
    text-align: center;
    margin-bottom: 14px;
}

.encabezado h1 {
    font-size: 28px;
    margin-bottom: 5px;
}

.encabezado p {
    font-size: 13px;
}

.tarjeta {
    background: white;
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.titulo {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 14px;
}

.formulario {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.campo label {
    display: block;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 5px;
}

input,
select,
textarea {
    width: 100%;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
    background: white;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.lista {
    width: 100%;
}

.fila {
    display: grid;
    grid-template-columns: 70px 1fr 115px 100px 40px;
    gap: 7px;
    margin-bottom: 7px;
    align-items: center;
}

.fila input,
.fila select {
    height: 35px;
}

.genero {
    font-weight: bold;
    text-align: center;
    transition: background 0.2s;
}

.genero-f {
    background: #ffd9e6 !important;
}

.genero-m {
    background: #d8efff !important;
}

.boton-agregar {
    width: 100%;
    border: none;
    background: #111;
    color: white;
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 5px;
}

.boton-agregar:hover {
    background: #222;
}

.boton-eliminar {
    border: none;
    background: #dc3545;
    color: white;
    height: 35px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.boton-eliminar:hover {
    background: #bb2d3b;
}

.total {
    margin-top: 14px;
    background: #edf1f5;
    padding: 11px;
    border-radius: 7px;
    display: flex;
    justify-content: space-between;
    font-size: 13px;
}

.boton-generar,
.boton-descargar {
    width: 100%;
    border: none;
    color: white;
    padding: 11px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 10px;
}

.boton-generar {
    background: #198754;
}

.boton-generar:hover {
    background: #157347;
}

.boton-generar:disabled {
    background: #777;
    cursor: wait;
}

.boton-descargar {
    background: #2864e6;
}

.boton-descargar:hover {
    background: #1d4fc0;
}

.estado {
    display: none;
    margin-top: 10px;
    padding: 10px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
    text-align: center;
}

.estado.exito {
    display: block;
    background: #d1e7dd;
    color: #0f5132;
}

.estado.error {
    display: block;
    background: #f8d7da;
    color: #842029;
}

.pie {
    background: #111;
    color: white;
    padding: 16px;
    border-radius: 12px;
    text-align: center;
    margin-top: 10px;
}

.pie h2 {
    font-size: 21px;
    margin-bottom: 4px;
}

.pie p {
    font-size: 11px;
}

@media (max-width: 700px) {

    .formulario {
        grid-template-columns: 1fr;
    }

    .fila {
        grid-template-columns: 55px 1fr 90px 75px 35px;
        gap: 5px;
    }

    .fila input,
    .fila select,
    .boton-eliminar {
        font-size: 11px;
    }
}

</style>
</head>

<body>

<div class="contenedor">

    <!-- ENCABEZADO -->

    <div class="encabezado">

        <h1>CASTSPORT</h1>

        <p>
            Sistema de pedidos y personalización de uniformes
        </p>

    </div>


    <!-- DATOS DEL EQUIPO -->

    <div class="tarjeta">

        <div class="titulo">
            📋 Datos del equipo
        </div>

        <div class="formulario">

            <div class="campo">

                <label>Nombre del equipo</label>

                <input
                    type="text"
                    id="equipo"
                    placeholder="Nombre del equipo">

            </div>


            <div class="campo">

                <label>Nombre del encargado</label>

                <input
                    type="text"
                    id="encargado"
                    placeholder="Nombre del encargado">

            </div>


            <div class="campo">

                <label>Teléfono / WhatsApp</label>

                <input
                    type="text"
                    id="telefono"
                    placeholder="Número de teléfono">

            </div>


            <div class="campo">

                <label>Tipo de uniforme</label>

                <select id="tipoUniforme">

                    <option>Camiseta</option>
                    <option>Conjunto</option>
                    <option>Uniforme completo</option>

                </select>

            </div>

        </div>

    </div>


    <!-- LISTA DE CAMISETAS -->

    <div class="tarjeta">

        <div class="titulo">
            👕 Lista de camisetas
        </div>

        <div id="listaCamisetas" class="lista"></div>

        <button
            type="button"
            class="boton-agregar"
            onclick="agregarCamiseta()">

            + Agregar camiseta

        </button>


        <div class="total">

            <span>Total de camisetas</span>

            <strong id="total">0</strong>

        </div>

    </div>


    <!-- OBSERVACIONES -->

    <div class="tarjeta">

        <div class="titulo">
            📝 Observaciones
        </div>


        <textarea
            id="observaciones"
            placeholder="Escribe aquí alguna observación del pedido..."></textarea>


        <button
            type="button"
            id="botonGenerar"
            class="boton-generar"
            onclick="generarPedido()">

            ☑ Generar pedido

        </button>


        <button
            type="button"
            class="boton-descargar"
            onclick="descargarPedido()">

            📥 Descargar pedido

        </button>


        <div id="estado" class="estado"></div>

    </div>


    <!-- PIE -->

    <div class="pie">

        <h2>CASTSPORT</h2>

        <p>
            Sistema de pedidos y personalización de uniformes
        </p>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
    "https://gsacpnubhwpmlxtfcgtc.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_msIUw1EzeJGOIpUSV4EkOA_n2Aimnsw";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================================
   TALLAS
   ========================================================= */

/*
 * XS eliminado.
 */

const tallas = [
    "4",
    "6",
    "8",
    "10",
    "12",
    "14",
    "16",
    "S",
    "M",
    "L",
    "XL",
    "XXL"
];


let contador = 0;


/* =========================================================
   ESTADOS
   ========================================================= */

function mostrarEstado(mensaje, tipo) {

    const estado =
        document.getElementById("estado");

    estado.textContent = mensaje;

    estado.className =
        "estado " + tipo;
}


function limpiarEstado() {

    const estado =
        document.getElementById("estado");

    estado.textContent = "";

    estado.className = "estado";
}


/* =========================================================
   AGREGAR CAMISETA
   ========================================================= */

function agregarCamiseta(
    numero = "",
    nombre = "",
    talla = "",
    genero = ""
) {

    contador++;

    const lista =
        document.getElementById("listaCamisetas");

    const fila =
        document.createElement("div");

    fila.className = "fila";


    fila.innerHTML = `

        <input
            type="text"
            class="numero"
            placeholder="Nº"
            value="${numero}">


        <input
            type="text"
            class="nombre"
            placeholder="Nombre"
            value="${nombre}">


        <select class="talla">

            <option value="">
                Talla
            </option>

            ${tallas.map(t => `
                <option
                    value="${t}"
                    ${t === talla ? "selected" : ""}>
                    ${t}
                </option>
            `).join("")}

        </select>


        <select
            class="genero ${
                genero === "F"
                ? "genero-f"
                : genero === "M"
                ? "genero-m"
                : ""
            }"
            onchange="cambiarGenero(this)">

            <option value="">
                Género
            </option>

            <option
                value="F"
                ${genero === "F" ? "selected" : ""}>
                F
            </option>

            <option
                value="M"
                ${genero === "M" ? "selected" : ""}>
                M
            </option>

        </select>


        <button
            type="button"
            class="boton-eliminar"
            onclick="eliminarCamiseta(this)">

            ×

        </button>

    `;


    lista.appendChild(fila);

    actualizarTotal();
}


/* =========================================================
   CAMBIAR COLOR GÉNERO
   ========================================================= */

function cambiarGenero(select) {

    select.classList.remove("genero-f");

    select.classList.remove("genero-m");


    if (select.value === "F") {

        select.classList.add("genero-f");

    }


    if (select.value === "M") {

        select.classList.add("genero-m");

    }
}


/* =========================================================
   ELIMINAR CAMISETA
   ========================================================= */

function eliminarCamiseta(boton) {

    boton.parentElement.remove();

    actualizarTotal();
}


/* =========================================================
   TOTAL
   ========================================================= */

function actualizarTotal() {

    const filas =
        document.querySelectorAll(".fila");

    document.getElementById("total").textContent =
        filas.length;
}


/* =========================================================
   OBTENER CAMISETAS
   ========================================================= */

function obtenerCamisetas() {

    const filas =
        document.querySelectorAll(".fila");


    const camisetas = [];


    filas.forEach((fila) => {

        const numero =
            fila.querySelector(".numero").value.trim();

        const nombre =
            fila.querySelector(".nombre").value.trim();

        const talla =
            fila.querySelector(".talla").value;

        const genero =
            fila.querySelector(".genero").value;


        /*
         * Si la fila está completamente vacía,
         * no la incluimos.
         */

        if (
            !numero &&
            !nombre &&
            !talla &&
            !genero
        ) {

            return;

        }


        camisetas.push({

            numero: numero,

            nombre: nombre,

            talla: talla,

            genero: genero

        });

    });


    return camisetas;
}


/* =========================================================
   GENERAR / GUARDAR PEDIDO
   ========================================================= */

async function generarPedido() {

    limpiarEstado();


    const boton =
        document.getElementById("botonGenerar");


    const equipo =
        document.getElementById("equipo")
        .value
        .trim();


    const encargado =
        document.getElementById("encargado")
        .value
        .trim();


    const telefono =
        document.getElementById("telefono")
        .value
        .trim();


    const tipo =
        document.getElementById("tipoUniforme")
        .value;


    const observaciones =
        document.getElementById("observaciones")
        .value
        .trim();


    const camisetas =
        obtenerCamisetas();


    /* VALIDACIONES */

    if (!equipo) {

        mostrarEstado(
            "Por favor, escribe el nombre del equipo.",
            "error"
        );

        return;
    }


    if (!encargado) {

        mostrarEstado(
            "Por favor, escribe el nombre del encargado.",
            "error"
        );

        return;
    }


    if (camisetas.length === 0) {

        mostrarEstado(
            "Agrega al menos una camiseta.",
            "error"
        );

        return;
    }


    /*
     * Revisar que las camisetas tengan
     * los datos necesarios.
     */

    for (let i = 0; i < camisetas.length; i++) {

        const camiseta =
            camisetas[i];


        if (!camiseta.nombre) {

            mostrarEstado(
                "La camiseta #" +
                (i + 1) +
                " necesita un nombre.",
                "error"
            );

            return;
        }


        if (!camiseta.talla) {

            mostrarEstado(
                "Selecciona la talla de " +
                camiseta.nombre +
                ".",
                "error"
            );

            return;
        }


        if (!camiseta.genero) {

            mostrarEstado(
                "Selecciona el género de " +
                camiseta.nombre +
                ".",
                "error"
            );

            return;
        }

    }


    /* EVITAR DOBLE CLIC */

    boton.disabled = true;

    boton.textContent =
        "⏳ Guardando pedido...";


    try {

        /* =================================================
           1. PEDIDO PRINCIPAL
           ================================================= */

        const {
            data: pedido,
            error: errorPedido
        } =
            await supabaseClient
                .from("pedidos")
                .insert({

                    equipo: equipo,

                    nombre_equipo: equipo,

                    encargado: encargado,

                    telefono: telefono,

                    tipo_uniforme: tipo,

                    observaciones:
                        observaciones || null

                })
                .select()
                .single();


        if (errorPedido) {

            throw errorPedido;

        }


        /* =================================================
           2. CAMISETAS
           ================================================= */

        const camisetasParaGuardar =
            camisetas.map((camiseta) => {

                return {

                    pedido_id: pedido.id,

                    numero:
                        camiseta.numero || null,

                    nombre:
                        camiseta.nombre,

                    talla:
                        camiseta.talla,

                    genero:
                        camiseta.genero

                };

            });


        const {
            error: errorCamisetas
        } =
            await supabaseClient
                .from("camisetas")
                .insert(camisetasParaGuardar);


        if (errorCamisetas) {

            throw errorCamisetas;

        }


        /* =================================================
           3. CONFIRMACIÓN
           ================================================= */

        mostrarEstado(
            "✅ Pedido guardado correctamente en Supabase. ID: " +
            pedido.id,
            "exito"
        );


        /*
         * Guardamos el ID para usarlo
         * también en el PDF.
         */

        window.ultimoPedidoId =
            pedido.id;


    }

    catch (error) {

        console.error(
            "Error guardando pedido:",
            error
        );


        mostrarEstado(
            "❌ No se pudo guardar el pedido: " +
            (
                error.message ||
                "Error desconocido"
            ),
            "error"
        );


        alert(
            "No se pudo guardar el pedido.\n\n" +
            (
                error.message ||
                "Error desconocido"
            )
        );

    }


    finally {

        boton.disabled = false;

        boton.textContent =
            "☑ Generar pedido";

    }

}


/* =========================================================
   DESCARGAR PEDIDO EN PDF
   ========================================================= */

function descargarPedido() {

    const equipo =
        document.getElementById("equipo")
        .value
        .trim();


    const encargado =
        document.getElementById("encargado")
        .value
        .trim();


    const telefono =
        document.getElementById("telefono")
        .value
        .trim();


    const tipo =
        document.getElementById("tipoUniforme")
        .value;


    const observaciones =
        document.getElementById("observaciones")
        .value
        .trim()
        || "Sin observaciones";


    const camisetas =
        obtenerCamisetas();


    /* VALIDACIÓN */

    if (!equipo) {

        alert(
            "Primero escribe el nombre del equipo."
        );

        return;
    }


    if (camisetas.length === 0) {

        alert(
            "Agrega al menos una camiseta antes de descargar."
        );

        return;
    }


    /*
     * Comprobar datos.
     */

    for (let i = 0; i < camisetas.length; i++) {

        if (!camisetas[i].nombre) {

            alert(
                "La camiseta #" +
                (i + 1) +
                " necesita un nombre."
            );

            return;
        }


        if (!camisetas[i].talla) {

            alert(
                "Selecciona la talla de " +
                camisetas[i].nombre
            );

            return;
        }


        if (!camisetas[i].genero) {

            alert(
                "Selecciona el género de " +
                camisetas[i].nombre
            );

            return;
        }

    }


    /* =================================================
       CREAR PDF
       ================================================= */

    const {
        jsPDF
    } = window.jspdf;


    const doc =
        new jsPDF({
            orientation: "portrait",
            unit: "mm",
            format: "a4"
        });


    const ancho =
        doc.internal.pageSize.getWidth();


    /* =================================================
       ENCABEZADO NEGRO
       ================================================= */

    doc.setFillColor(
        17,
        17,
        17
    );


    doc.roundedRect(
        15,
        12,
        ancho - 30,
        32,
        4,
        4,
        "F"
    );


    doc.setTextColor(
        255,
        255,
        255
    );


    doc.setFont(
        "helvetica",
        "bold"
    );


    doc.setFontSize(24);


    doc.text(
        "CASTSPORT",
        ancho / 2,
        25,
        {
            align: "center"
        }
    );


    doc.setFontSize(10);


    doc.setFont(
        "helvetica",
        "normal"
    );


    doc.text(
        "Sistema de pedidos y personalización de uniformes",
        ancho / 2,
        33,
        {
            align: "center"
        }
    );


    /* =================================================
       NÚMERO Y FECHA
       ================================================= */

    const fecha =
        new Date();


    /*
     * CORRECCIÓN:
     * Solo muestra la fecha,
     * sin la hora.
     */

    const fechaTexto =
        fecha.toLocaleDateString(
            "es-PE"
        );


    doc.setTextColor(
        40,
        40,
        40
    );


    doc.setFont(
        "helvetica",
        "bold"
    );


    doc.setFontSize(11);


    doc.text(
        "PEDIDO",
        15,
        54
    );


    doc.setFont(
        "helvetica",
        "normal"
    );


    doc.text(
        window.ultimoPedidoId
            ? "#" + window.ultimoPedidoId
            : "Pendiente de guardar",
        40,
        54
    );


    /*
     * FECHA
     * Posicionada correctamente.
     */

    doc.setFont(
        "helvetica",
        "bold"
    );


    doc.text(
        "Fecha:",
        ancho - 75,
        54
    );


    doc.setFont(
        "helvetica",
        "normal"
    );


    doc.text(
        fechaTexto,
        ancho - 15,
        54,
        {
            align: "right"
        }
    );


    /* =================================================
       DATOS DEL EQUIPO
       ================================================= */

    doc.setFillColor(
        240,
        243,
        246
    );


    doc.roundedRect(
        15,
        62,
        ancho - 30,
        45,
        3,
        3,
        "F"
    );


    doc.setTextColor(
        20,
        20,
        20
    );


    doc.setFont(
        "helvetica",
        "bold"
    );


    doc.setFontSize(14);


    doc.text(
        "DATOS DEL EQUIPO",
        20,
        72
    );


    doc.setFontSize(9);


    doc.setFont(
        "helvetica",
        "bold"
    );


    doc.text(
        "Nombre del equipo:",
        20,
        82
    );


    doc.text(
        "Encargado:",
        110,
        82
    );


    doc.text(
        "Teléfono / WhatsApp:",
        20,
        94
    );


    doc.text(
        "Tipo de uniforme:",
        110,
        94
    );


    doc.setFont(
        "helvetica",
        "normal"
    );


    doc.text(
        equipo || "-",
        20,
        88
    );


    doc.text(
        encargado || "-",
        110,
        88
    );


    doc.text(
        telefono || "-",
        20,
        100
    );


    doc.text(
        tipo || "-",
        110,
        100
    );


    /* =================================================
       LISTA DE CAMISETAS
       ================================================= */

    doc.setFont(
        "helvetica",
        "bold"
    );


    doc.setFontSize(14);


    doc.text(
        "LISTA DE CAMISETAS",
        15,
        119
    );


    const filasPDF =
        camisetas.map(
            (camiseta, index) => [

                index + 1,

                camiseta.numero || "-",

                camiseta.nombre || "-",

                camiseta.talla || "-",

                camiseta.genero || "-"

            ]
        );


    doc.autoTable({

        startY: 124,

        head: [[
            "#",
            "Nº",
            "Nombre",
            "Talla",
            "Género"
        ]],

        body: filasPDF,

        theme: "grid",

        styles: {

            font: "helvetica",

            fontSize: 10,

            cellPadding: 4,

            textColor: [
                30,
                30,
                30
            ]

        },

        headStyles: {

            fillColor: [
                17,
                17,
                17
            ],

            textColor: [
                255,
                255,
                255
            ],

            fontStyle: "bold"

        },

        alternateRowStyles: {

            fillColor: [
                245,
                247,
                249
            ]

        },

        columnStyles: {

            0: {
                cellWidth: 12,
                halign: "center"
            },

            1: {
                cellWidth: 22,
                halign: "center"
            },

            2: {
                cellWidth: "auto"
            },

            3: {
                cellWidth: 25,
                halign: "center"
            },

            4: {
                cellWidth: 25,
                halign: "center"
            }

        }

    });


    /* =================================================
       TOTAL
       ================================================= */

    let posicionY =
        doc.lastAutoTable.finalY + 10;


    doc.setFillColor(
        237,
        241,
        245
    );


    doc.roundedRect(
        15,
        posicionY,
        ancho - 30,
        12,
        2,
        2,
        "F"
    );


    doc.setTextColor(
        20,
        20,
        20
    );


    doc.setFont(
        "helvetica",
        "bold"
    );


    doc.setFontSize(10);


    doc.text(
        "TOTAL DE CAMISETAS",
        20,
        posicionY + 8
    );


    doc.text(
        String(camisetas.length),
        ancho - 20,
        posicionY + 8,
        {
            align: "right"
        }
    );


    /* =================================================
       OBSERVACIONES
       ================================================= */

    posicionY += 22;


    doc.setFontSize(14);


    doc.text(
        "OBSERVACIONES",
        15,
        posicionY
    );


    posicionY += 5;


    doc.setFont(
        "helvetica",
        "normal"
    );


    doc.setFontSize(10);


    const textoObservaciones =
        doc.splitTextToSize(
            observaciones,
            ancho - 40
        );


    const altoObservaciones =
        Math.max(
            25,
            textoObservaciones.length * 5 + 12
        );


    doc.setFillColor(
        248,
        249,
        250
    );


    doc.setDrawColor(
        210,
        210,
        210
    );


    doc.roundedRect(
        15,
        posicionY,
        ancho - 30,
        altoObservaciones,
        3,
        3,
        "FD"
    );


    doc.text(
        textoObservaciones,
        20,
        posicionY + 9
    );


    /* =================================================
       PIE
       ================================================= */

    const altoPagina =
        doc.internal.pageSize.getHeight();


    doc.setFillColor(
        17,
        17,
        17
    );


    doc.roundedRect(
        15,
        altoPagina - 32,
        ancho - 30,
        20,
        3,
        3,
        "F"
    );


    doc.setTextColor(
        255,
        255,
        255
    );


    doc.setFont(
        "helvetica",
        "bold"
    );


    doc.setFontSize(12);


    doc.text(
        "CASTSPORT",
        ancho / 2,
        altoPagina - 22,
        {
            align: "center"
        }
    );


    doc.setFont(
        "helvetica",
        "normal"
    );


    doc.setFontSize(7);


    doc.text(
        "Sistema de pedidos y personalización de uniformes",
        ancho / 2,
        altoPagina - 16,
        {
            align: "center"
        }
    );


    /* =================================================
       DESCARGAR
       ================================================= */

    const nombreArchivo =
        equipo
            .replace(
                /[^a-z0-9áéíóúñü]/gi,
                "-"
            )
            .replace(
                /-+/g,
                "-"
            );


    const idArchivo =
        window.ultimoPedidoId
            ? "-pedido-" +
              window.ultimoPedidoId
            : "";


    doc.save(
        "CASTSPORT-" +
        nombreArchivo +
        idArchivo +
        ".pdf"
    );

}
