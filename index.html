<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CASTSPORT - Sistema de pedidos de uniformes</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- jsPDF para descargar el pedido -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
      padding: 0 16px 40px;
    }

    .contenedor {
      max-width: 1000px;
      margin: auto;
    }

    /* =========================
       ENCABEZADO
    ========================= */

    .encabezado {
      background: #111;
      color: white;
      text-align: center;
      padding: 17px 15px;
      border-radius: 10px;
      margin: 13px 0;
    }

    .encabezado h1 {
      font-size: 25px;
      margin-bottom: 5px;
    }

    .encabezado p {
      font-size: 12px;
      font-weight: bold;
    }

    /* =========================
       TARJETAS
    ========================= */

    .tarjeta {
      background: white;
      border-radius: 11px;
      padding: 16px;
      margin-bottom: 13px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .titulo-seccion {
      font-size: 17px;
      margin-bottom: 12px;
      font-weight: bold;
    }

    /* =========================
       FORMULARIOS
    ========================= */

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 10px;
    }

    .campo {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 8px 9px;
      font-size: 12px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2584e8;
      box-shadow: 0 0 0 2px rgba(37,132,232,0.10);
    }

    textarea {
      min-height: 79px;
      resize: vertical;
      font-family: monospace;
    }

    /* =========================
       CAMISETAS
    ========================= */

    .fila-camiseta {
      display: grid;
      grid-template-columns: 44px 1fr 72px 30px;
      gap: 7px;
      align-items: center;
      margin-bottom: 7px;
    }

    .fila-camiseta input,
    .fila-camiseta select {
      height: 27px;
      padding: 5px 7px;
      font-size: 11px;
    }

    .btn-eliminar {
      height: 27px;
      width: 30px;
      border: none;
      border-radius: 6px;
      background: #dc3545;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-eliminar:hover {
      background: #bb2d3b;
    }

    .btn-agregar {
      width: 100%;
      border: none;
      border-radius: 6px;
      padding: 8px;
      background: #111;
      color: white;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }

    .btn-agregar:hover {
      background: #222;
    }

    .total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #eef2f5;
      padding: 11px;
      border-radius: 6px;
      margin-top: 12px;
      font-size: 11px;
    }

    .total strong {
      font-size: 13px;
    }

    /* =========================
       BOTONES
    ========================= */

    .boton {
      width: 100%;
      border: none;
      border-radius: 6px;
      padding: 10px;
      color: white;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      margin-top: 7px;
    }

    .btn-generar {
      background: #198754;
    }

    .btn-generar:hover {
      background: #157347;
    }

    .btn-descargar {
      background: #2864e8;
    }

    .btn-descargar:hover {
      background: #1e52c5;
    }

    .boton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* =========================
       MENSAJES
    ========================= */

    #mensaje {
      display: none;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
      font-size: 12px;
      font-weight: bold;
    }

    .mensaje-exito {
      display: block !important;
      background: #d1e7dd;
      color: #0f5132;
    }

    .mensaje-error {
      display: block !important;
      background: #f8d7da;
      color: #842029;
    }

    .pedido-numero {
      margin-top: 7px;
      font-size: 11px;
      font-weight: normal;
    }

    /* =========================
       PIE
    ========================= */

    .pie {
      background: #111;
      color: white;
      text-align: center;
      padding: 16px;
      border-radius: 10px;
      margin-top: 0;
    }

    .pie h2 {
      font-size: 20px;
      margin-bottom: 4px;
    }

    .pie p {
      font-size: 10px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 650px) {

      body {
        padding: 0 10px 25px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .fila-camiseta {
        grid-template-columns: 42px 1fr 65px 30px;
      }

      .encabezado h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

<div class="contenedor">

  <!-- =========================
       ENCABEZADO
  ========================= -->

  <header class="encabezado">
    <h1>CASTSPORT</h1>
    <p>Sistema de pedidos y personalización de uniformes</p>
  </header>


  <!-- =========================
       DATOS DEL EQUIPO
  ========================= -->

  <section class="tarjeta">

    <div class="titulo-seccion">
      📋 Datos del equipo
    </div>

    <div class="grid">

      <div class="campo">
        <label for="nombreEquipo">Nombre del equipo</label>
        <input
          type="text"
          id="nombreEquipo"
          placeholder="Nombre del equipo"
        >
      </div>

      <div class="campo">
        <label for="encargado">Nombre del encargado</label>
        <input
          type="text"
          id="encargado"
          placeholder="Nombre del encargado"
        >
      </div>

      <div class="campo">
        <label for="telefono">Teléfono / WhatsApp</label>
        <input
          type="tel"
          id="telefono"
          placeholder="Número de teléfono"
        >
      </div>

      <div class="campo">
        <label for="tipoUniforme">Tipo de uniforme</label>

        <select id="tipoUniforme">
          <option value="Camiseta">Camiseta</option>
        </select>
      </div>

    </div>

  </section>


  <!-- =========================
       LISTA DE CAMISETAS
  ========================= -->

  <section class="tarjeta">

    <div class="titulo-seccion">
      👕 Lista de camisetas
    </div>

    <div id="listaCamisetas"></div>

    <button
      type="button"
      class="btn-agregar"
      onclick="agregarCamiseta()"
    >
      + Agregar camiseta
    </button>

    <div class="total">
      <span>Total de camisetas</span>
      <strong id="totalCamisetas">1</strong>
    </div>

  </section>


  <!-- =========================
       OBSERVACIONES
  ========================= -->

  <section class="tarjeta">

    <div class="titulo-seccion">
      📝 Observaciones
    </div>

    <textarea
      id="observaciones"
      placeholder="Escribe aquí alguna observación del pedido..."
    ></textarea>

    <button
      type="button"
      id="btnGenerar"
      class="boton btn-generar"
      onclick="generarPedido()"
    >
      ✅ Generar pedido
    </button>

    <button
      type="button"
      id="btnDescargar"
      class="boton btn-descargar"
      onclick="descargarPedido()"
    >
      📥 Descargar pedido
    </button>

    <div id="mensaje"></div>

  </section>


  <!-- =========================
       PIE
  ========================= -->

  <footer class="pie">
    <h2>CASTSPORT</h2>
    <p>Sistema de pedidos y personalización de uniformes</p>
  </footer>

</div>


<script>

/* =========================================================
   CONFIGURACIÓN SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://gsacpnubhwpmlxtfcgtc.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_msIUw1EzeJGOIpUSV4EkOA_n2Aimnsw";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   VARIABLES
========================================================= */

let numeroCamiseta = 0;
let ultimoPedido = null;


/* =========================================================
   INICIAR PÁGINA
========================================================= */

document.addEventListener("DOMContentLoaded", function () {

  agregarCamiseta();

});


/* =========================================================
   AGREGAR CAMISETA
========================================================= */

function agregarCamiseta() {

  numeroCamiseta++;

  const lista =
    document.getElementById("listaCamisetas");

  const fila =
    document.createElement("div");

  fila.className = "fila-camiseta";

  fila.innerHTML = `

    <input
      type="number"
      class="numero"
      placeholder="Nº"
      min="0"
    >

    <input
      type="text"
      class="nombre"
      placeholder="Nombre"
    >

    <select class="talla">

      <option value="">Talla</option>
      <option value="XS">XS</option>
      <option value="S">S</option>
      <option value="M">M</option>
      <option value="L">L</option>
      <option value="XL">XL</option>
      <option value="XXL">XXL</option>

    </select>

    <button
      type="button"
      class="btn-eliminar"
      onclick="eliminarCamiseta(this)"
      title="Eliminar"
    >
      ×
    </button>

  `;

  lista.appendChild(fila);

  actualizarTotal();

}


/* =========================================================
   ELIMINAR CAMISETA
========================================================= */

function eliminarCamiseta(boton) {

  const filas =
    document.querySelectorAll(".fila-camiseta");

  if (filas.length <= 1) {

    mostrarMensaje(
      "Debe existir al menos una camiseta.",
      "error"
    );

    return;
  }

  boton.parentElement.remove();

  actualizarTotal();

}


/* =========================================================
   ACTUALIZAR TOTAL
========================================================= */

function actualizarTotal() {

  const total =
    document.querySelectorAll(".fila-camiseta").length;

  document.getElementById("totalCamisetas").textContent =
    total;

}


/* =========================================================
   OBTENER CAMISETAS
========================================================= */

function obtenerCamisetas() {

  const filas =
    document.querySelectorAll(".fila-camiseta");

  const camisetas = [];

  filas.forEach(function (fila) {

    const numero =
      fila.querySelector(".numero").value.trim();

    const nombre =
      fila.querySelector(".nombre").value.trim();

    const talla =
      fila.querySelector(".talla").value;

    camisetas.push({
      numero: numero,
      nombre: nombre,
      talla: talla
    });

  });

  return camisetas;

}


/* =========================================================
   VALIDAR FORMULARIO
========================================================= */

function validarFormulario() {

  const nombreEquipo =
    document.getElementById("nombreEquipo").value.trim();

  const encargado =
    document.getElementById("encargado").value.trim();

  const telefono =
    document.getElementById("telefono").value.trim();

  const camisetas =
    obtenerCamisetas();

  if (!nombreEquipo) {

    mostrarMensaje(
      "Escribe el nombre del equipo.",
      "error"
    );

    return false;
  }

  if (!encargado) {

    mostrarMensaje(
      "Escribe el nombre del encargado.",
      "error"
    );

    return false;
  }

  if (!telefono) {

    mostrarMensaje(
      "Escribe el teléfono o WhatsApp.",
      "error"
    );

    return false;
  }

  if (camisetas.length === 0) {

    mostrarMensaje(
      "Agrega al menos una camiseta.",
      "error"
    );

    return false;
  }

  for (let i = 0; i < camisetas.length; i++) {

    if (!camisetas[i].numero) {

      mostrarMensaje(
        "Completa el número de la camiseta " + (i + 1) + ".",
        "error"
      );

      return false;
    }

    if (!camisetas[i].nombre) {

      mostrarMensaje(
        "Completa el nombre de la camiseta " + (i + 1) + ".",
        "error"
      );

      return false;
    }

    if (!camisetas[i].talla) {

      mostrarMensaje(
        "Selecciona la talla de la camiseta " + (i + 1) + ".",
        "error"
      );

      return false;
    }

  }

  return true;

}


/* =========================================================
   GENERAR PEDIDO Y GUARDAR EN SUPABASE
========================================================= */

async function generarPedido() {

  if (!validarFormulario()) {
    return;
  }

  const boton =
    document.getElementById("btnGenerar");

  boton.disabled = true;

  boton.textContent =
    "⏳ Guardando pedido...";

  try {

    const nombreEquipo =
      document.getElementById("nombreEquipo").value.trim();

    const encargado =
      document.getElementById("encargado").value.trim();

    const telefono =
      document.getElementById("telefono").value.trim();

    const tipoUniforme =
      document.getElementById("tipoUniforme").value;

    const observaciones =
      document.getElementById("observaciones").value.trim();

    const camisetas =
      obtenerCamisetas();


    /* ==========================================
       1. GUARDAR PEDIDO
    ========================================== */

    const { data: pedido, error: errorPedido } =
      await supabaseClient
        .from("pedidos")
        .insert([{

          nombre_equipo: nombreEquipo,
          encargado: encargado,
          telefono: telefono,
          tipo_uniforme: tipoUniforme,
          observaciones: observaciones

        }])
        .select()
        .single();


    if (errorPedido) {

      console.error(errorPedido);

      throw new Error(
        "No se pudo guardar el pedido: " +
        errorPedido.message
      );

    }


    /* ==========================================
       2. PREPARAR CAMISETAS
    ========================================== */

    const camisetasParaGuardar =
      camisetas.map(function (camiseta) {

        return {

          pedido_id: pedido.id,

          numero: camiseta.numero,
          nombre: camiseta.nombre,
          talla: camiseta.talla

        };

      });


    /* ==========================================
       3. GUARDAR CAMISETAS
    ========================================== */

    const { error: errorCamisetas } =
      await supabaseClient
        .from("camisetas")
        .insert(camisetasParaGuardar);


    if (errorCamisetas) {

      console.error(errorCamisetas);

      throw new Error(
        "El pedido se creó, pero hubo un problema guardando las camisetas: " +
        errorCamisetas.message
      );

    }


    /* ==========================================
       4. GUARDAR DATOS DEL ÚLTIMO PEDIDO
    ========================================== */

    ultimoPedido = {

      id: pedido.id,

      nombreEquipo:
        nombreEquipo,

      encargado:
        encargado,

      telefono:
        telefono,

      tipoUniforme:
        tipoUniforme,

      observaciones:
        observaciones,

      camisetas:
        camisetas

    };


    /* ==========================================
       5. MENSAJE
    ========================================== */

    mostrarMensaje(

      "✅ Pedido guardado correctamente." +
      "<div class='pedido-numero'>" +
      "Número de pedido: " +
      pedido.id +
      "</div>",

      "exito"

    );


    boton.textContent =
      "✅ Pedido guardado";


  } catch (error) {

    console.error(error);

    mostrarMensaje(

      "❌ " + error.message,

      "error"

    );

    boton.textContent =
      "✅ Generar pedido";

  } finally {

    boton.disabled = false;

  }

}


/* =========================================================
   DESCARGAR PEDIDO
========================================================= */

async function descargarPedido() {

  /*
   * Si todavía no se ha generado/guardado,
   * permitimos descargar los datos actuales.
   */

  const nombreEquipo =
    document.getElementById("nombreEquipo").value.trim();

  const encargado =
    document.getElementById("encargado").value.trim();

  const telefono =
    document.getElementById("telefono").value.trim();

  const tipoUniforme =
    document.getElementById("tipoUniforme").value;

  const observaciones =
    document.getElementById("observaciones").value.trim();

  const camisetas =
    obtenerCamisetas();


  if (!nombreEquipo || !encargado || !telefono) {

    mostrarMensaje(
      "Completa primero los datos del equipo.",
      "error"
    );

    return;
  }


  if (camisetas.length === 0) {

    mostrarMensaje(
      "Agrega al menos una camiseta.",
      "error"
    );

    return;
  }


  /* ==========================================
     CREAR PDF
  ========================================== */

  if (
    window.jspdf &&
    window.jspdf.jsPDF
  ) {

    const { jsPDF } =
      window.jspdf;

    const doc =
      new jsPDF();


    let y = 20;


    /* TÍTULO */

    doc.setFontSize(20);

    doc.setFont("helvetica", "bold");

    doc.text(
      "CASTSPORT",
      105,
      y,
      { align: "center" }
    );


    y += 8;

    doc.setFontSize(10);

    doc.setFont("helvetica", "normal");

    doc.text(
      "Sistema de pedidos y personalización de uniformes",
      105,
      y,
      { align: "center" }
    );


    y += 15;


    /* DATOS DEL EQUIPO */

    doc.setFontSize(13);

    doc.setFont("helvetica", "bold");

    doc.text(
      "Datos del equipo",
      15,
      y
    );

    y += 8;

    doc.setFontSize(10);

    doc.setFont("helvetica", "normal");

    doc.text(
      "Equipo: " + nombreEquipo,
      15,
      y
    );

    y += 6;

    doc.text(
      "Encargado: " + encargado,
      15,
      y
    );

    y += 6;

    doc.text(
      "Teléfono / WhatsApp: " + telefono,
      15,
      y
    );

    y += 6;

    doc.text(
      "Tipo de uniforme: " + tipoUniforme,
      15,
      y
    );


    y += 12;


    /* CAMISETAS */

    doc.setFontSize(13);

    doc.setFont("helvetica", "bold");

    doc.text(
      "Lista de camisetas",
      15,
      y
    );

    y += 8;


    doc.setFontSize(10);

    doc.setFont("helvetica", "bold");

    doc.text("Nº", 15, y);

    doc.text("Nombre", 45, y);

    doc.text("Talla", 155, y);


    y += 6;


    doc.setFont("helvetica", "normal");


    camisetas.forEach(function (camiseta, index) {

      if (y > 270) {

        doc.addPage();

        y = 20;

      }

      doc.text(
        String(camiseta.numero),
        15,
        y
      );

      doc.text(
        camiseta.nombre,
        45,
        y
      );

      doc.text(
        camiseta.talla,
        155,
        y
      );

      y += 6;

    });


    y += 7;


    /* TOTAL */

    doc.setFont("helvetica", "bold");

    doc.text(
      "Total de camisetas: " +
      camisetas.length,
      15,
      y
    );


    y += 12;


    /* OBSERVACIONES */

    doc.setFontSize(13);

    doc.text(
      "Observaciones",
      15,
      y
    );

    y += 7;

    doc.setFontSize(10);

    doc.setFont("helvetica", "normal");


    const textoObservaciones =
      observaciones ||
      "Sin observaciones";


    const lineas =
      doc.splitTextToSize(
        textoObservaciones,
        180
      );


    doc.text(
      lineas,
      15,
      y
    );


    y +=
      (lineas.length * 5) +
      15;


    /* NÚMERO DE PEDIDO */

    if (ultimoPedido) {

      doc.setFont("helvetica", "bold");

      doc.text(
        "Número de pedido: " +
        ultimoPedido.id,
        15,
        y
      );

    }


    /* FECHA */

    const fecha =
      new Date().toLocaleString(
        "es-ES"
      );


    y += 7;

    doc.setFont("helvetica", "normal");

    doc.text(
      "Fecha: " + fecha,
      15,
      y
    );


    /* DESCARGAR */

    const nombreArchivo =
      "CASTSPORT-" +
      limpiarNombreArchivo(nombreEquipo) +
      ".pdf";


    doc.save(nombreArchivo);


    mostrarMensaje(
      "📥 Pedido descargado correctamente.",
      "exito"
    );

    return;

  }


  /* ==========================================
     FALLBACK
  ========================================== */

  const contenido =
    crearTextoPedido();

  const blob =
    new Blob(
      [contenido],
      { type: "text/plain;charset=utf-8" }
    );

  const url =
    URL.createObjectURL(blob);

  const enlace =
    document.createElement("a");

  enlace.href = url;

  enlace.download =
    "CASTSPORT-pedido.txt";

  enlace.click();

  URL.revokeObjectURL(url);

}


/* =========================================================
   CREAR TEXTO DEL PEDIDO
========================================================= */

function crearTextoPedido() {

  const nombreEquipo =
    document.getElementById("nombreEquipo").value.trim();

  const encargado =
    document.getElementById("encargado").value.trim();

  const telefono =
    document.getElementById("telefono").value.trim();

  const tipoUniforme =
    document.getElementById("tipoUniforme").value;

  const observaciones =
    document.getElementById("observaciones").value.trim();

  const camisetas =
    obtenerCamisetas();


  let texto = "";

  texto += "====================================\n";
  texto += "             CASTSPORT\n";
  texto += "====================================\n\n";

  texto += "DATOS DEL EQUIPO\n";
  texto += "------------------------------------\n";

  texto += "Equipo: " +
    nombreEquipo + "\n";

  texto += "Encargado: " +
    encargado + "\n";

  texto += "Teléfono / WhatsApp: " +
    telefono + "\n";

  texto += "Tipo de uniforme: " +
    tipoUniforme + "\n\n";


  texto += "LISTA DE CAMISETAS\n";
  texto += "------------------------------------\n";


  camisetas.forEach(function (camiseta) {

    texto +=
      "Nº " +
      camiseta.numero +
      " | " +
      camiseta.nombre +
      " | Talla " +
      camiseta.talla +
      "\n";

  });


  texto += "\n";

  texto +=
    "Total de camisetas: " +
    camisetas.length +
    "\n\n";


  texto += "OBSERVACIONES\n";
  texto += "------------------------------------\n";

  texto +=
    observaciones ||
    "Sin observaciones";

  texto += "\n\n";


  if (ultimoPedido) {

    texto +=
      "Número de pedido: " +
      ultimoPedido.id +
      "\n";

  }


  texto +=
    "Fecha: " +
    new Date().toLocaleString("es-ES") +
    "\n";


  texto += "\n====================================\n";

  return texto;

}


/* =========================================================
   LIMPIAR NOMBRE PARA ARCHIVO
========================================================= */

function limpiarNombreArchivo(nombre) {

  return nombre
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-zA-Z0-9-_]/g, "-")
    .replace(/-+/g, "-")
    .replace(/^-|-$/g, "");

}


/* =========================================================
   MOSTRAR MENSAJE
========================================================= */

function mostrarMensaje(texto, tipo) {

  const mensaje =
    document.getElementById("mensaje");

  mensaje.className = "";

  mensaje.innerHTML =
    texto;

  if (tipo === "exito") {

    mensaje.classList.add(
      "mensaje-exito"
    );

  } else {

    mensaje.classList.add(
      "mensaje-error"
    );

  }

}

</script>
