<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://gsacpnubhwpmlxtfcgtc.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_msIUw1EzeJGOIpUSV4EkOA_n2Aimnsw";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================================
   CONTRASEÑA DEL ADMIN
========================================================= */

const CONTRASENA_ADMIN = "CASTSPORT";


/* =========================================================
   ESTADOS
========================================================= */

function mostrarEstado(mensaje, tipo) {

    const estado =
        document.getElementById("estado");

    estado.textContent = mensaje;

    estado.className =
        "estado " + tipo;

}


function limpiarEstado() {

    const estado =
        document.getElementById("estado");

    estado.textContent = "";

    estado.className = "estado";

}


/* =========================================================
   LOGIN
========================================================= */

function iniciarSesion() {

    const password =
        document
            .getElementById("password")
            .value;

    const estado =
        document.getElementById(
            "loginEstado"
        );


    if (password !== CONTRASENA_ADMIN) {

        estado.textContent =
            "❌ Contraseña incorrecta.";

        estado.className =
            "estado error";

        return;

    }


    estado.textContent = "";

    estado.className = "estado";


    sessionStorage.setItem(
        "castsport_admin",
        "1"
    );


    mostrarPanel();

}


/* =========================================================
   MOSTRAR PANEL
========================================================= */

function mostrarPanel() {

    document
        .getElementById("login")
        .style.display = "none";

    document
        .getElementById("panel")
        .style.display = "block";

    cargarPedidos();

}


/* =========================================================
   CERRAR SESIÓN
========================================================= */

function cerrarSesion() {

    sessionStorage.removeItem(
        "castsport_admin"
    );


    document
        .getElementById("panel")
        .style.display = "none";

    document
        .getElementById("login")
        .style.display = "block";

    document
        .getElementById("password")
        .value = "";

}


/* =========================================================
   COMPROBAR SESIÓN
========================================================= */

function comprobarSesion() {

    const conectado =
        sessionStorage.getItem(
            "castsport_admin"
        );


    if (conectado === "1") {

        mostrarPanel();

    }

}


/* =========================================================
   CARGAR PEDIDOS
========================================================= */

async function cargarPedidos() {

    mostrarEstado(
        "⏳ Cargando pedidos...",
        "cargando"
    );


    const lista =
        document.getElementById(
            "listaPedidos"
        );


    lista.innerHTML = "";


    const {
        data: pedidos,
        error: errorPedidos
    } =
        await supabaseClient
            .from("pedidos")
            .select("*")
            .order(
                "id",
                {
                    ascending: false
                }
            );


    if (errorPedidos) {

        console.error(errorPedidos);

        mostrarEstado(
            "❌ Error cargando pedidos: " +
            errorPedidos.message,
            "error"
        );

        return;

    }


    if (
        !pedidos ||
        pedidos.length === 0
    ) {

        document
            .getElementById(
                "cantidadPedidos"
            )
            .textContent = "0";


        lista.innerHTML = `

            <div class="sin-pedidos">

                📭

                <br><br>

                No hay pedidos todavía.

            </div>

        `;


        limpiarEstado();

        return;

    }


    const {
        data: camisetas,
        error: errorCamisetas
    } =
        await supabaseClient
            .from("camisetas")
            .select("*")
            .order(
                "id",
                {
                    ascending: true
                }
            );


    if (errorCamisetas) {

        console.error(errorCamisetas);

        mostrarEstado(
            "❌ Error cargando camisetas: " +
            errorCamisetas.message,
            "error"
        );

        return;

    }


    document
        .getElementById(
            "cantidadPedidos"
        )
        .textContent =
            pedidos.length;


    pedidos.forEach(
        pedido => {

            const camisetasPedido =
                (camisetas || []).filter(
                    camiseta =>
                        String(
                            camiseta.pedido_id
                        ) ===
                        String(
                            pedido.id
                        )
                );


            crearPedidoHTML(
                pedido,
                camisetasPedido,
                lista
            );

        }
    );


    limpiarEstado();

}


/* =========================================================
   CREAR PEDIDO HTML
========================================================= */

function crearPedidoHTML(
    pedido,
    camisetas,
    contenedor
) {

    const pedidoDiv =
        document.createElement("div");

    pedidoDiv.className = "pedido";


    const fechaTexto =
        obtenerFechaPedido(pedido);


    const nombreEquipo =
        pedido.nombre_equipo ||
        pedido.equipo ||
        "Sin nombre";


    /* =====================================================
       CABECERA
    ===================================================== */

    const cabecera =
        document.createElement("div");

    cabecera.className =
        "pedido-cabecera";


    cabecera.innerHTML = `

        <div>

            <div class="pedido-titulo">

                🧾 PEDIDO #${escaparHTML(
                    pedido.id
                )}

            </div>

            <div class="pedido-subtitulo">

                ${escaparHTML(
                    nombreEquipo
                )}

                ·

                ${camisetas.length}

                camiseta(s)

            </div>

        </div>

        <div class="flecha">
            ▼
        </div>

    `;


    /* =====================================================
       CONTENIDO
    ===================================================== */

    const contenido =
        document.createElement("div");

    contenido.className =
        "pedido-contenido";


    contenido.innerHTML = `

        <div class="seccion-titulo">

            📋 Datos del equipo

        </div>


        <div class="datos">


            <div class="dato">

                <div class="dato-label">
                    Nombre del equipo
                </div>

                <div class="dato-valor">

                    ${escaparHTML(
                        nombreEquipo
                    )}

                </div>

            </div>


            <div class="dato">

                <div class="dato-label">
                    Encargado
                </div>

                <div class="dato-valor">

                    ${escaparHTML(
                        pedido.encargado ||
                        "-"
                    )}

                </div>

            </div>


            <div class="dato">

                <div class="dato-label">
                    Teléfono / WhatsApp
                </div>

                <div class="dato-valor">

                    ${escaparHTML(
                        pedido.telefono ||
                        "-"
                    )}

                </div>

            </div>


            <div class="dato">

                <div class="dato-label">
                    Tipo de uniforme
                </div>

                <div class="dato-valor">

                    ${escaparHTML(
                        pedido.tipo_uniforme ||
                        "-"
                    )}

                </div>

            </div>


            <div class="dato">

                <div class="dato-label">
                    Fecha del pedido
                </div>

                <div class="dato-valor">

                    ${escaparHTML(
                        fechaTexto
                    )}

                </div>

            </div>


        </div>


        <div class="seccion-titulo">

            👕 Camisetas del pedido

        </div>


        <div class="tabla-contenedor">

            <table class="tabla">

                <thead>

                    <tr>

                        <th>#</th>
                        <th>Nº</th>
                        <th>Nombre</th>
                        <th>Talla</th>
                        <th>Género</th>

                    </tr>

                </thead>

                <tbody>

                    ${crearFilasCamisetas(
                        camisetas
                    )}

                </tbody>

            </table>

        </div>


        <div class="total">

            <span>
                Total de camisetas
            </span>

            <strong>
                ${camisetas.length}
            </strong>

        </div>


        <div class="seccion-titulo">

            📝 Observaciones

        </div>


        <div class="observaciones">

            ${escaparHTML(
                pedido.observaciones ||
                "Sin observaciones"
            )}

        </div>


        <div class="acciones-pedido">

            <button
                class="boton-pedido boton-pdf"
                data-accion="pdf"
            >

                📄 Descargar PDF

            </button>


            <button
                class="boton-pedido boton-eliminar"
                data-accion="eliminar"
            >

                🗑️ Eliminar pedido

            </button>

        </div>

    `;


    /* =====================================================
       ABRIR / CERRAR
    ===================================================== */

    cabecera.addEventListener(
        "click",
        () => {

            pedidoDiv.classList.toggle(
                "abierto"
            );

        }
    );


    /* =====================================================
       BOTÓN PDF
    ===================================================== */

    const botonPDF =
        contenido.querySelector(
            '[data-accion="pdf"]'
        );


    botonPDF.addEventListener(
        "click",
        (evento) => {

            evento.stopPropagation();

            descargarPDF(
                pedido,
                camisetas
            );

        }
    );


    /* =====================================================
       BOTÓN ELIMINAR
    ===================================================== */

    const botonEliminar =
        contenido.querySelector(
            '[data-accion="eliminar"]'
        );


    botonEliminar.addEventListener(
        "click",
        async (evento) => {

            evento.stopPropagation();

            await eliminarPedido(
                pedido,
                botonEliminar
            );

        }
    );


    pedidoDiv.appendChild(
        cabecera
    );

    pedidoDiv.appendChild(
        contenido
    );

    contenedor.appendChild(
        pedidoDiv
    );

}


/* =========================================================
   FILAS CAMISETAS
========================================================= */

function crearFilasCamisetas(
    camisetas
) {

    if (
        !camisetas ||
        camisetas.length === 0
    ) {

        return `

            <tr>

                <td
                    colspan="5"
                    style="text-align:center;"
                >

                    No hay camisetas registradas.

                </td>

            </tr>

        `;

    }


    return camisetas.map(
        (camiseta, index) => {

            let claseGenero = "";


            if (
                camiseta.genero === "F"
            ) {

                claseGenero =
                    "genero-f";

            }


            if (
                camiseta.genero === "M"
            ) {

                claseGenero =
                    "genero-m";

            }


            return `

                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        ${escaparHTML(
                            camiseta.numero ||
                            "-"
                        )}
                    </td>

                    <td>
                        ${escaparHTML(
                            camiseta.nombre ||
                            "-"
                        )}
                    </td>

                    <td>
                        ${escaparHTML(
                            camiseta.talla ||
                            "-"
                        )}
                    </td>

                    <td class="${claseGenero}">

                        ${escaparHTML(
                            camiseta.genero ||
                            "-"
                        )}

                    </td>

                </tr>

            `;

        }
    ).join("");

}


/* =========================================================
   ELIMINAR PEDIDO
========================================================= */

async function eliminarPedido(
    pedido,
    boton
) {

    const numeroPedido =
        pedido.id;


    /*
     * PRIMERA CONFIRMACIÓN
     */

    const primera =
        confirm(
            "⚠️ ATENCIÓN\n\n" +
            "Vas a eliminar el PEDIDO #" +
            numeroPedido +
            ".\n\n" +
            "También se eliminarán todas las camisetas " +
            "pertenecientes a este pedido.\n\n" +
            "¿Quieres continuar?"
        );


    if (!primera) {

        return;

    }


    /*
     * SEGUNDA CONFIRMACIÓN
     */

    const segunda =
        confirm(
            "🚨 SEGUNDA CONFIRMACIÓN\n\n" +
            "Esta acción NO se puede deshacer.\n\n" +
            "Se eliminará definitivamente:\n" +
            "• El pedido #" +
            numeroPedido +
            "\n" +
            "• Todas sus camisetas\n\n" +
            "¿CONFIRMAS ELIMINARLO DEFINITIVAMENTE?"
        );


    if (!segunda) {

        return;

    }


    boton.disabled = true;

    boton.textContent =
        "⏳ Eliminando...";


    try {

        /*
         * Primero eliminamos las camisetas.
         */

        const {
            error: errorCamisetas
        } =
            await supabaseClient
                .from("camisetas")
                .delete()
                .eq(
                    "pedido_id",
                    pedido.id
                );


        if (errorCamisetas) {

            throw errorCamisetas;

        }


        /*
         * Después eliminamos el pedido.
         */

        const {
            error: errorPedido
        } =
            await supabaseClient
                .from("pedidos")
                .delete()
                .eq(
                    "id",
                    pedido.id
                );


        if (errorPedido) {

            throw errorPedido;

        }


        mostrarEstado(
            "✅ Pedido #" +
            numeroPedido +
            " eliminado correctamente.",
            "exito"
        );


        /*
         * Recargar la lista.
         */

        await cargarPedidos();


    }
    catch (error) {

        console.error(
            "Error eliminando pedido:",
            error
        );


        boton.disabled = false;

        boton.textContent =
            "🗑️ Eliminar pedido";


        mostrarEstado(
            "❌ No se pudo eliminar el pedido: " +
            (
                error.message ||
                "Error desconocido"
            ),
            "error"
        );


        alert(
            "No se pudo eliminar el pedido.\n\n" +
            (
                error.message ||
                "Error desconocido"
            )
        );

    }

}

/* =========================================================
   FECHA DEL PEDIDO
========================================================= */

function obtenerFechaPedido(
    pedido
) {

    /*
     * Intentamos utilizar diferentes
     * nombres de fecha por compatibilidad
     * con la tabla actual.
     */

    const valor =
        pedido.fecha_pedido ||
        pedido.created_at ||
        pedido.fecha ||
        pedido.fecha_creacion;


    if (!valor) {

        return "Sin fecha";

    }


    const fecha =
        new Date(valor);


    if (
        isNaN(
            fecha.getTime()
        )
    ) {

        return String(valor);

    }


    return fecha.toLocaleString(
        "es-PE",
        {
            dateStyle: "short",
            timeStyle: "short"
        }
    );

}


/* =========================================================
   SEGURIDAD HTML
========================================================= */

function escaparHTML(
    texto
) {

    if (
        texto === null ||
        texto === undefined
    ) {

        return "";

    }


    return String(texto)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
